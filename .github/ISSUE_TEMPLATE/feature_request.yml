name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem first, then the idea.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Clawboard to do?
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Where would the data come from?
      description: Clawboard only shows what the session reports. If the idea needs a number, say where Claude Code exposes it.
